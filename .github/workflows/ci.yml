name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Build and Run Host Tests
        run: |
          mkdir build
          cd build
          cmake ../test/host
          make
          ctest --output-on-failure
      - name: Run Paste Viewer Mutation Check
        run: node tools/test/check_paste_viewer.js --mutations

  idf-build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build IDF Project
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32p4
          idf.py build
      - name: Verify sdkconfig
        run: |
          grep -E '^CONFIG_IDF_TARGET="esp32p4"' sdkconfig
          grep '^CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y' sdkconfig
          grep '^CONFIG_ESP32P4_REV_MIN_100=y' sdkconfig

  idf-build-kvm-board:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build IDF Project with KVM_BOARD_ENABLE=y
        run: |
          . $IDF_PATH/export.sh
          printf 'CONFIG_KVM_BOARD_ENABLE=y\n' > sdkconfig.ci_kvm_board
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci_kvm_board" set-target esp32p4
          idf.py build
      - name: Verify sdkconfig and kvm_board ISR IRAM placement
        run: |
          . $IDF_PATH/export.sh
          grep -E '^CONFIG_IDF_TARGET="esp32p4"' sdkconfig
          grep '^CONFIG_ESP32P4_SELECTS_REV_LESS_V3=y' sdkconfig
          grep '^CONFIG_ESP32P4_REV_MIN_100=y' sdkconfig
          grep '^CONFIG_KVM_BOARD_ENABLE=y' sdkconfig
          grep '^CONFIG_GPTIMER_ISR_CACHE_SAFE=y' sdkconfig
          grep '^CONFIG_GPTIMER_CTRL_FUNC_IN_IRAM=y' sdkconfig
          python3 tools/test/check_kvm_board_iram.py build/quad-ipkvm.elf

  idf-build-iso:
    # ISO virtual media (P8): microSD (SD_ENABLE) + the HTTP API (ISO_ENABLE). Neither is enabled by default; this job keeps them building.
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build IDF Project with SD_ENABLE=y and ISO_ENABLE=y
        run: |
          . $IDF_PATH/export.sh
          printf 'CONFIG_SD_ENABLE=y\nCONFIG_ISO_ENABLE=y\n' > sdkconfig.ci_iso
          idf.py -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci_iso" set-target esp32p4
          idf.py build
      - name: Verify sdkconfig
        run: |
          grep -E '^CONFIG_IDF_TARGET="esp32p4"' sdkconfig
          grep '^CONFIG_SD_ENABLE=y' sdkconfig
          grep '^CONFIG_ISO_ENABLE=y' sdkconfig
          grep '^CONFIG_FATFS_USE_FASTSEEK=y' sdkconfig
