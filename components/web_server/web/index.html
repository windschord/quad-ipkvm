<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quad IP-KVM</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="container">
        <h1>Quad IP-KVM</h1>
        <div id="error-message" class="error-hidden"></div>
        <div id="view-setup" class="view-hidden">
            <h2>初期設定</h2>
            <form id="form-setup">
                <label for="setup-password">パスワード</label>
                <input type="password" id="setup-password" aria-describedby="setup-hint" required>
                <p class="hint" id="setup-hint">10 文字以上、128 バイト以下。連番、同じ文字の繰り返し、よく使われるパスワード、「admin」を含むものは使えません。</p>
                <label for="setup-password-confirm">パスワード（確認）</label>
                <input type="password" id="setup-password-confirm" required>
                <button type="submit">設定する</button>
            </form>
        </div>
        <div id="view-login" class="view-hidden">
            <h2>ログイン</h2>
            <form id="form-login">
                <label for="login-password">パスワード</label>
                <input type="password" id="login-password" required>
                <button type="submit">ログイン</button>
            </form>
        </div>

        <div id="view-dashboard" class="view-hidden">
            <h2>ログイン済み</h2>
            <div class="controls">
                <button id="btn-input-toggle">入力を有効にする</button>
                <button id="btn-pointer-lock" disabled>マウス(相対)切替</button>
                <span id="input-status">入力: 無効</span>
                <span id="usb-status">ターゲット: 未接続</span>
            </div>
            <div>
                <canvas id="video" width="1280" height="720" tabindex="0"></canvas>
            </div>
            <div id="video-status">接続中...</div>
            <p class="hint">入力を無効にするには Esc キーを長押しするか、ボタンを押してください。</p>
            <button id="btn-logout">ログアウト</button>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
